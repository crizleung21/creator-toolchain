name: refresh-phase3-evidence

on:
  push:
    branches:
      - agent/phase-3-execution-lifecycle

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase-3-execution-lifecycle
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate exact package and behavior freshness evidence
        run: |
          python3 scripts/package_integrity.py \
            --root . \
            --package-root plugin/creator-toolchain \
            --write docs/qa/package-integrity-report.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          report_path = Path("docs/qa/package-integrity-report.json")
          status_path = Path("docs/qa/behavior-acceptance-status.json")
          report = json.loads(report_path.read_text(encoding="utf-8"))
          status = {
              "schema_version": "1.0.0",
              "status": "STALE",
              "report_path": "docs/qa/behavior-acceptance-report.json",
              "report_package_payload_sha256": "97038ec39d25cf6a6c3fbc7cd01ecdacd1d0c6e47f3500f45c3b3b115e3ed4c9",
              "current_package_payload_sha256": report["payload_sha256"],
              "invalidated_by": "Phase 3 Execution Skill integration and plugin payload change",
              "reason": "The 34 stored behavior artifacts remain internally verified for the earlier package payload, but they have not been rerun against the current Execution Skill, closure, recovery, and package bytes.",
              "rerun_required": True,
              "required_action": "Rerun all 34 behavior cases with evidence-linked observations during Phase 7 before release.",
              "recorded_at": "2026-07-18T05:37:12Z",
          }
          status_path.write_text(
              json.dumps(status, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Commit exact generated evidence
        run: |
          if git diff --quiet -- \
            docs/qa/package-integrity-report.json \
            docs/qa/behavior-acceptance-status.json; then
            echo "Evidence already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/qa/package-integrity-report.json \
            docs/qa/behavior-acceptance-status.json
          git commit -m "Phase 3: refresh exact package evidence"
          git push origin HEAD:agent/phase-3-execution-lifecycle
