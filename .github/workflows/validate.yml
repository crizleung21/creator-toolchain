name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: |
          set -o pipefail
          python3 -m unittest discover -s tests -p 'test_*.py' -v 2>&1 | tee /tmp/creator-toolchain-unit-tests.log
      - name: Upload unit-test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-log-${{ github.run_id }}
          path: /tmp/creator-toolchain-unit-tests.log
          if-no-files-found: error
          retention-days: 7
      - name: Validate behavior catalog
        run: python3 scripts/run_behavior_acceptance.py --root . --validate-catalog
      - name: Run writable golden E2E
        run: |
          rm -rf /tmp/creator-toolchain-golden-e2e
          python3 scripts/run_golden_e2e.py \
            --root /tmp/creator-toolchain-golden-e2e \
            --source-root . \
            --commit-sha "${GITHUB_SHA}" \
            --report /tmp/creator-toolchain-golden-e2e-report.json
      - name: Upload writable golden E2E report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-e2e-report-${{ github.run_id }}
          path: /tmp/creator-toolchain-golden-e2e-report.json
          if-no-files-found: error
          retention-days: 7
      - name: Validate canonical surface registry
        run: python3 scripts/materialize_surface_registry.py --root . --check
      - name: Validate materialized project-type references
        run: python3 scripts/materialize_project_type_refs.py --root . --check
      - run: python3 scripts/sync_plugin_skills.py --check
      - name: Generate package-integrity candidate
        run: python3 scripts/package_integrity.py --root . --package-root plugin/creator-toolchain --write /tmp/package-integrity-report.json
      - name: Upload package-integrity candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-integrity-candidate-${{ github.run_id }}
          path: /tmp/package-integrity-report.json
          if-no-files-found: error
          retention-days: 7
      - run: python3 scripts/package_integrity.py --root . --package-root plugin/creator-toolchain --check docs/qa/package-integrity-report.json
      - run: python3 scripts/validate_creator_toolchain.py --scope all
      - run: |
          python3 scripts/build_plugin_package.py --root . --output /tmp/build-a.zip
          python3 scripts/build_plugin_package.py --root . --output /tmp/build-b.zip
          cmp /tmp/build-a.zip /tmp/build-b.zip
      - run: git diff --exit-code
