name: phase9-finalize

on:
  push:
    branches: [agent/phase-9-docs-final-reconciliation]
    paths:
      - README.md
      - AGENTS.md
      - CHANGELOG.md
      - plugin/creator-toolchain/README.md
      - plugin/creator-toolchain/CHANGELOG.md
      - docs/architecture/**
      - docs/qa/**
      - docs/migrations/**
      - docs/operations/**
      - docs/releases/**
      - docs/implementation/phase-9/**
      - docs/implementation/FINAL-RECONCILIATION.md
      - scripts/finalize_phase9.py
      - tests/test_documentation_contracts.py
      - .github/workflows/phase9-finalize.yml
      - .github/workflows/publish-release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase9-finalize-${{ github.ref }}
  cancel-in-progress: true

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Synchronize version and Plugin mirror
        run: |
          python3 scripts/release_creator_toolchain.py --root . --version "$(cat VERSION)"
          python3 scripts/sync_plugin_skills.py --write

      - name: Refresh package inventory and invalidate old behavior evidence
        run: |
          python3 scripts/package_integrity.py \
            --root . \
            --package-root plugin/creator-toolchain \
            --write docs/qa/package-integrity-report.json
          python3 scripts/mark_behavior_stale.py \
            --root . \
            --reason "Phase 9 packaged documentation changed the final Plugin payload" \
            --recorded-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Run pre-promotion tests and writable Golden E2E
        run: |
          set -o pipefail
          python3 -m unittest discover -s tests -p 'test_*.py' -v \
            2>&1 | tee /tmp/phase9-unit-tests.log
          rm -rf /tmp/phase9-golden
          python3 scripts/run_golden_e2e.py \
            --root /tmp/phase9-golden \
            --source-root . \
            --commit-sha "${GITHUB_SHA}" \
            --report /tmp/phase9-golden-report.json

      - name: Run complete provider-neutral behavior catalog
        run: |
          rm -rf .phase9
          python3 scripts/run_behavior_acceptance.py \
            --root . \
            --response-command "python3 -m scripts.adapters.deterministic_contract_response" \
            --evaluator-command "python3 -m scripts.adapters.deterministic_contract_evaluator" \
            --run-id "phase9-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --commit-sha "${GITHUB_SHA}" \
            --output .phase9/behavior \
            --timeout 60
          python3 scripts/validate_behavior_report.py \
            .phase9/behavior/report.json \
            --expected-count 34 \
            --require-all-catalog

      - name: Promote behavior evidence and recalculate Health
        run: |
          RECORDED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "RECORDED_AT=${RECORDED_AT}" >> "${GITHUB_ENV}"
          python3 scripts/promote_behavior_evidence.py \
            --root . \
            --report .phase9/behavior/report.json \
            --evidence-root .phase9/behavior \
            --tested-commit "${GITHUB_SHA}" \
            --promotion-run-id "${GITHUB_RUN_ID}" \
            --recorded-at "${RECORDED_AT}"
          python3 scripts/creator_health_check.py \
            --root . \
            --calculated-at "${RECORDED_AT}" \
            --write \
            --fail-on amber

      - name: Build final release evidence and Phase 9 reconciliation
        run: |
          mkdir -p .phase9/release
          python3 scripts/release_creator_toolchain.py \
            --root . \
            --build \
            --output-dir .phase9/release \
            --commit-sha "${GITHUB_SHA}" \
            --skip-unit-tests \
            --skip-golden
          cp .phase9/release/release-evidence.json docs/qa/release-evidence.json
          python3 scripts/finalize_phase9.py \
            --root . \
            --tested-commit "${GITHUB_SHA}" \
            --workflow-run-id "${GITHUB_RUN_ID}" \
            --recorded-at "${RECORDED_AT}"

      - name: Final Phase 9 validation
        run: |
          python3 scripts/materialize_surface_registry.py --root . --check
          python3 scripts/materialize_project_type_refs.py --root . --check
          python3 scripts/sync_plugin_skills.py --check
          python3 scripts/package_integrity.py \
            --root . \
            --package-root plugin/creator-toolchain \
            --check docs/qa/package-integrity-report.json
          python3 scripts/validate_creator_toolchain.py --scope all
          python3 scripts/release_creator_toolchain.py \
            --root . \
            --check \
            --commit-sha "${GITHUB_SHA}" \
            --skip-unit-tests \
            --skip-golden
          python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Commit evidence-only finalization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/qa/package-integrity-report.json \
            docs/qa/behavior-acceptance-report.json \
            docs/qa/behavior-acceptance-status.json \
            docs/qa/behavior-acceptance-current.zip \
            docs/qa/release-evidence.json \
            docs/qa/final-release-status.json \
            .creator/health/health-report.json \
            .creator/state.json \
            docs/implementation/phase-7 \
            docs/implementation/phase-9 \
            docs/implementation/FINAL-RECONCILIATION.md \
            docs/releases/v1.1.0.md
          git diff --cached --quiet || \
            git commit -m "Phase 9: promote final release evidence"
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Upload Phase 9 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase9-finalization-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .phase9
            /tmp/phase9-unit-tests.log
            /tmp/phase9-golden-report.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
