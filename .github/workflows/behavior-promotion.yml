name: behavior-promotion

on:
  pull_request:
    paths:
      - .github/behavior-promotion-trigger.json
      - .github/workflows/behavior-promotion.yml
      - scripts/validate_focused_behavior_run.py
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  models: read

concurrency:
  group: behavior-promotion-${{ github.ref }}
  cancel-in-progress: false

jobs:
  focused-gate-and-full-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate catalog, adapters, and focused gate utility
        run: |
          python3 scripts/run_behavior_acceptance.py --root . --validate-catalog
          python3 -m unittest tests.test_github_models_adapters -v
          python3 -m py_compile scripts/validate_focused_behavior_run.py
      - name: Validate focused eight-case release gate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/validate_focused_behavior_run.py \
            --repository "${GITHUB_REPOSITORY}" \
            --run-id 30017660530 \
            --case-id INTAKE-P02 \
            --case-id EXEC-P01 \
            --case-id STATE-P01 \
            --case-id RULE-P02 \
            --case-id AUDIT-P01 \
            --case-id LOCAL-EXEC-P01 \
            --case-id LOCAL-STATE-P01 \
            --case-id LOCAL-AUDIT-P01 \
            --output /tmp/creator-toolchain-focused-gate.json
      - name: Run final complete 34-case promotion catalog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CREATOR_BEHAVIOR_RESPONSE_MODEL: openai/gpt-4.1-mini
          CREATOR_BEHAVIOR_EVALUATOR_MODEL: openai/gpt-4o-mini
          CREATOR_GITHUB_MODELS_TIMEOUT: "240"
        run: |
          set -o pipefail
          RUN_ID="promotion-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          OUTPUT="behavior-runtime-output/${RUN_ID}"
          rm -rf "${OUTPUT}"
          python3 scripts/run_behavior_acceptance.py \
            --root . \
            --response-command "python3 -m scripts.adapters.github_models_response" \
            --evaluator-command "python3 -m scripts.adapters.github_models_evaluator" \
            --run-id "${RUN_ID}" \
            --commit-sha "${{ github.event.pull_request.head.sha || github.sha }}" \
            --output "${OUTPUT}" \
            --timeout 420 \
            2>&1 | tee /tmp/creator-toolchain-behavior-runtime.log
      - name: Upload focused gate and full promotion evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: behavior-promotion-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/creator-toolchain-focused-gate.json
            behavior-runtime-output
            /tmp/creator-toolchain-behavior-runtime.log
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
